[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BranchManager"
version = "1.1.0"
authors = [
    {name = "Nicholas Dimonaco", email = "nicholas@dimonaco.co.uk"}
]
description = "BranchManager: Answers the critical question — Has this microbial lineage already been isolated and characterised, or is it sufficiently novel and underrepresented to justify whole-genome sequencing (WGS) investment?"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["Isolate Collection", "Marker Gene", "Whole Genome Sequencing", "Microbial Lineage", "Novelty Assessment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.10.8",
    "pandas",
    "openpyxl>=3.1",
    "scipy>=1.8",
]


[project.urls]
Homepage = "https://github.com/NickJD/BranchManager"
"Bug Tracker" = "https://github.com/NickJD/BranchManager/issues"

[project.scripts]
BranchManager = "branchmanager.cli:main"
branchmanager = "branchmanager.cli:main"



[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["branchmanager*"]

[tool.setuptools.package-data]
branchmanager = [
    # Reference anchors
    "data/*.fasta",
    "data/*.tsv",

    # Sanger Studio interface
    "data/*.html",

    # Bundled example and template files
    "examples/*.tsv",
    "examples/*.jpg",
    "examples/*.sh",
]