name: Build and deploy BranchManager documentation and dashboard

on:
  push:
    branches: [main]
    paths:
      - "src/branchmanager/reporting.py"
      - "src/branchmanager/data/**"
      - "docs/**"
      - "scripts/build_demo_dashboard.py"
      - "tests/test_demo_dashboard_build.py"
      - "pyproject.toml"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Regenerate and validate dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install BranchManager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Regenerate dashboard from synthetic fixtures
        run: python scripts/build_demo_dashboard.py

      - name: Validate generated dashboard
        run: python scripts/build_demo_dashboard.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
