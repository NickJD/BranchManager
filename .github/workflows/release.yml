name: Build and publish GitHub release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          package_version = project["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          init_text = Path("src/branchmanager/__init__.py").read_text()
          match = re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", init_text)
          init_version = match.group(1) if match else None
          if tag_version != package_version or tag_version != init_version:
              raise SystemExit(
                  f"Release tag v{tag_version}, pyproject.toml version "
                  f"{package_version}, and package __version__ {init_version} "
                  "must all match."
              )
          print(f"Version check passed: {tag_version}")
          PY

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish GitHub Release with distribution files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
