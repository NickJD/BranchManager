name: BranchManager CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-and-core-tests:
    name: Dashboard and core reporting tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install BranchManager and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run dashboard and reporting regression tests
        run: |
          pytest -q \
            tests/test_reporting_dashboard.py \
            tests/test_reporting_dashboard_pangenome_fixes.py \
            tests/test_demo_dashboard_build.py

      - name: Check Python syntax
        run: python -m compileall -q src scripts
